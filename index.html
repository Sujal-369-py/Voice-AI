<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voice Chat</title>
</head>
<body>

  <button id="record">Record</button>
  <p id="user"></p>
  <p id="ai"></p>
  <audio id="audio" controls></audio>
  
  <script>
  let recorder, chunks = [], recording = false
  
  const btn = document.getElementById("record")
  const userP = document.getElementById("user")
  const aiP = document.getElementById("ai")
  const audioPlayer = document.getElementById("audio")
  
  btn.onclick = async () => {
    if (!recording) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
      recorder = new MediaRecorder(stream)
      chunks = []
  
      recorder.ondataavailable = e => chunks.push(e.data)
  
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: "audio/wav" })
        const fd = new FormData()
        fd.append("audio", blob, "voice.wav")
  
        const res = await fetch("http://localhost:8000/upload", {
          method: "POST",
          body: fd
        })
  
        const data = await res.json()
  
        userP.innerText = "You: " + data.user
        aiP.innerText = "AI: " + data.ai
  
        if (data.audio) {
          const bytes = atob(data.audio)
          const arr = new Uint8Array(bytes.length)
          for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i)
  
          const audioBlob = new Blob([arr], { type: "audio/wav" })
          audioPlayer.src = URL.createObjectURL(audioBlob)
          audioPlayer.play()
        }
      }
  
      recorder.start()
      btn.innerText = "Stop"
      recording = true
    } else {
      recorder.stop()
      btn.innerText = "Record"
      recording = false
    }
  }
  </script>
</body>
</html>
